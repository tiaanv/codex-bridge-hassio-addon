name: Codex Bridge (Hassio Add-on)
version: "2026.7.13.1"
slug: codex_bridge
description: Experimental OpenAI and Ollama compatible bridge powered by GPTMock
url: https://github.com/h3racl3z/codex-bridge-hassio-addon
# Intentionally no image key: Supervisor builds the Dockerfile locally from
# the pinned GPTMock GitHub source instead of pulling the upstream Docker image.
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
stage: experimental
ingress: true
ingress_port: 8099
ingress_stream: true
panel_icon: mdi:robot-outline
panel_title: Codex Bridge (Hassio Add-on)
panel_admin: true
options:
  log_level: info
  reasoning_effort: medium
  reasoning_summary: auto
  reasoning_compat: standard
  expose_reasoning_models: false
  enable_web_search: false
schema:
  log_level: list(debug|info|warning|error)
  reasoning_effort: list(minimal|low|medium|high|xhigh)
  reasoning_summary: list(auto|concise|detailed|none)
  reasoning_compat: list(standard|legacy|o3|think-tags)
  expose_reasoning_models: bool
  enable_web_search: bool
watchdog: http://[HOST]:[PORT:8099]/health
